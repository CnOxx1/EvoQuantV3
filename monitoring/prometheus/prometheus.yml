global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "evoquant"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          instance: "evoquant-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
